[project]
name = "foghorn"
version = "0.1.0"
description = "Foghorn: an AI incident-command center built as a production-grade, multi-graph LangGraph application that exercises LangGraph and LangGraph Studio end to end."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.2",
    "langgraph-sdk>=0.4",
    "langgraph-cli[inmem]>=0.4.42",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langsmith>=0.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]

# `langgraph dev` / `langgraph build` put the config dir on sys.path but NOT src/, so the project must be an
# installable package (package=false breaks dependencies:["."] with ModuleNotFoundError). Verified in docs/design.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foghorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider -p no:langsmith_plugin"
faulthandler_timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: spawns a real `langgraph dev` server (offline, loopback only)",
    "live: calls real model providers (never in CI; needs keys; opt-in with -m live)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "ignore::DeprecationWarning:langchain_core.*"]

[tool.coverage.run]
source = ["src/foghorn"]
branch = true
[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF", "PT", "C4", "TID", "PERF"]
ignore = ["E501", "S101", "RUF012", "PT018", "PERF401"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "RUF", "E741", "B007"]
"src/foghorn/data/**" = ["S311"]          # seeded simulation RNG, not cryptography
"src/foghorn/models/offline.py" = ["S324"]
[tool.ruff.lint.isort]
known-first-party = ["foghorn"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["foghorn"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false   # @tool, @auth.authenticate, @app.get are untyped decorators
[[tool.mypy.overrides]]
module = ["langgraph_api.*", "langgraph_cli.*"]
ignore_missing_imports = true
