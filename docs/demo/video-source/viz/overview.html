<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foghorn: ten graphs</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="fh.css">
<style>
  #hdr { position: absolute; left: 21px; right: 21px; top: 8px; height: 36px; display: flex; align-items: center; gap: 14px; }
  #hdr h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; white-space: nowrap; }
  #hdr h1 span { color: var(--accent); }
  #stages { display: flex; gap: 3px; flex: 1; justify-content: center; }
  .st { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 999px; border: 1px solid transparent; font-size: 15px; font-weight: 600; color: var(--text-3); white-space: nowrap; opacity: .5; }
  .st i { width: 9px; height: 9px; border-radius: 50%; background: var(--sc); flex: none; }
  .st.on { opacity: 1; color: var(--text-2); }
  .st.cur { color: var(--text); background: color-mix(in srgb, var(--sc) 16%, transparent); border-color: color-mix(in srgb, var(--sc) 55%, transparent); }
  #legend { display: flex; gap: 10px; font-size: 15px; color: var(--text-3); white-space: nowrap; align-items: center; }
  #legend svg { vertical-align: middle; margin-right: 5px; }
  .card { position: absolute; border-radius: 14px; border: 1.5px solid #1f2638; background: rgba(19, 24, 35, 0); overflow: hidden; }
  .card .ttl { position: absolute; left: 12px; top: 8px; font: 700 18px/22px var(--mono); letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
  .card .chip { position: absolute; left: 12px; top: 35px; max-width: calc(100% - 24px); font-size: 15px; line-height: 19px; font-weight: 600; padding: 2px 9px; border-radius: 12px; color: var(--sc); background: color-mix(in srgb, var(--sc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 38%, transparent); }
  .card svg { position: absolute; overflow: visible; }
</style>
</head>
<body>
  <div id="hdr">
    <h1>Foghorn: <span>ten</span> LangGraph graphs</h1>
    <div id="stages"></div>
    <div id="legend"></div>
  </div>
  <div id="grid"></div>
  <script type="module" src="overview.js"></script>
</body>
</html>
